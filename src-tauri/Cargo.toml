[package]
name = "punto-de-venta"
version = "0.5.1"
description = "Sistema de punto de venta, inventario y caja para tiendas de barrio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tribuna_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite embebido: no exige que el equipo tenga nada instalado.
# `backup` da la API que restaura una copia dentro de la conexion abierta,
# sin tener que cerrarla ni reemplazar archivos bloqueados por Windows.
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }

# Argon2id para las contraseñas. Nunca texto plano.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.9", features = ["std"] }

chrono = "0.4"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
